name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp
            THEME=kypo-v5

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            _copy_file() {
              local src=$1
              local dst=$2
              cat $src | base64 | \
                _in_vm "base64 -d > /tmp/kc-upload && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > $dst' < /tmp/kc-upload"
            }

            echo "===> [1] Tao thu muc theme trong pod..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/resources/css"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/messages"

            echo "===> [2] Copy tat ca .ftl files..."
            for f in $SRC/login/*.ftl; do
              fname=$(basename $f)
              echo "    -> $fname"
              _copy_file $f /opt/keycloak/themes/$THEME/login/$fname
            done

            echo "===> [3] Copy theme.properties, css, messages..."
            _copy_file $SRC/login/theme.properties \
              /opt/keycloak/themes/$THEME/login/theme.properties
            _copy_file $SRC/login/resources/css/login.css \
              /opt/keycloak/themes/$THEME/login/resources/css/login.css
            _copy_file $SRC/login/messages/messages_en.properties \
              /opt/keycloak/themes/$THEME/login/messages/messages_en.properties

            echo "===> [4] Clear Keycloak cache qua Admin API..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c '
              TOKEN=\$(/opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \$KEYCLOAK_ADMIN \
                --password \$KEYCLOAK_ADMIN_PASSWORD 2>&1) && \
              /opt/keycloak/bin/kcadm.sh create cache/clear-realm-cache -r CRCZP 2>&1 || \
              /opt/keycloak/bin/kcadm.sh create cache/clear-user-cache -r CRCZP 2>&1 || \
              echo \"Cache clear attempted\"
            '"

            echo "===> [5] Verify files trong pod..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- find /opt/keycloak/themes/$THEME -type f"

            echo "===> [6] Keycloak log moi nhat..."
            _in_vm "sudo kubectl logs $KC_POD -n $KC_NS --tail=20 2>&1"

            echo "===> Done!"