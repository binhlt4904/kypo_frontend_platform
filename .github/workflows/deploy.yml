name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak login theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp

            # Dùng theme name mới mỗi lần deploy để tránh cache theme.
            # Không restart Keycloak vì theme đang được copy trực tiếp vào pod, restart sẽ mất theme.
            THEME="vuontre-login-${{ github.run_number }}-${{ github.run_attempt }}"

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" \
                --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            _copy_file() {
              local src="$1"
              local dst="$2"

              if [ ! -f "$src" ]; then
                echo "Missing local file: $src"
                exit 1
              fi

              local encoded
              encoded=$(base64 -w0 "$src")

              _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c 'mkdir -p \$(dirname $dst) && printf %s \"$encoded\" | base64 -d > $dst && chmod 0644 $dst && echo Copied $dst size=\$(wc -c < $dst) bytes'"
            }

            echo "===> [1] Check source theme folder on server..."
            test -d "$SRC/login"
            test -f "$SRC/login/resources/css/login.css"
            test -f "$SRC/login/messages/messages_en.properties"
            find "$SRC" -type f | sort

            echo "===> [2] Create clean theme folder in Keycloak pod: $THEME"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c 'rm -rf /opt/keycloak/themes/$THEME && mkdir -p /opt/keycloak/themes/$THEME/login/resources/css /opt/keycloak/themes/$THEME/login/messages'"

            echo "===> [3] Write theme.properties with parent=keycloak..."
            printf '%s\n' \
              'parent=keycloak' \
              'import=common/keycloak' \
              'styles=css/login.css' \
              'locales=en' > /tmp/theme.properties
            _copy_file "/tmp/theme.properties" "/opt/keycloak/themes/$THEME/login/theme.properties"

            echo "===> [4] Copy CSS and messages only. No FTL files needed."
            _copy_file "$SRC/login/resources/css/login.css" "/opt/keycloak/themes/$THEME/login/resources/css/login.css"
            _copy_file "$SRC/login/messages/messages_en.properties" "/opt/keycloak/themes/$THEME/login/messages/messages_en.properties"

            echo "===> [5] Verify theme files in pod..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c 'find /opt/keycloak/themes/$THEME -type f | sort && echo ---theme.properties--- && cat /opt/keycloak/themes/$THEME/login/theme.properties && echo ---ls--- && ls -la /opt/keycloak/themes/$THEME /opt/keycloak/themes/$THEME/login /opt/keycloak/themes/$THEME/login/resources/css /opt/keycloak/themes/$THEME/login/messages'"

            echo "===> [6] Apply loginTheme=$THEME to non-master realm..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c '
              set +e

              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \"\$KEYCLOAK_ADMIN\" \
                --password \"\$KEYCLOAK_ADMIN_PASSWORD\"

              if [ \$? -ne 0 ]; then
                echo "Cannot login with kcadm. Theme was copied, but auto-apply was skipped. Choose manually: $THEME"
                exit 0
              fi

              echo "Available realms:"
              /opt/keycloak/bin/kcadm.sh get realms --fields realm

              REALM=\$(/opt/keycloak/bin/kcadm.sh get realms --fields realm 2>/dev/null \
                | grep -o "\\\"realm\\\"[ ]*:[ ]*\\\"[^\\\"]*\\\"" \
                | sed "s/.*: *\\\"//;s/\\\"//" \
                | grep -v "^master$" \
                | head -1)

              if [ -z "\$REALM" ]; then
                echo "No non-master realm found. Choose Login theme manually: $THEME"
                exit 0
              fi

              echo "Applying loginTheme=$THEME to realm: \$REALM"
              /opt/keycloak/bin/kcadm.sh update realms/\$REALM -s loginTheme=$THEME

              if [ \$? -ne 0 ]; then
                echo "Auto-apply failed. Choose Login theme manually: $THEME"
                exit 0
              fi
            '"

            echo "===> [7] Debug after applying theme..."
            echo "===> DEBUG: Theme files in pod"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c 'echo Theme=$THEME && find /opt/keycloak/themes/$THEME -type f -maxdepth 6 | sort && echo --- theme.properties --- && cat /opt/keycloak/themes/$THEME/login/theme.properties && echo --- css size --- && ls -lh /opt/keycloak/themes/$THEME/login/resources/css/login.css && echo --- messages size --- && ls -lh /opt/keycloak/themes/$THEME/login/messages/messages_en.properties'"

            echo "===> DEBUG: Theme folders under /opt/keycloak/themes"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c 'ls -la /opt/keycloak/themes | tail -80'"

            echo "===> DEBUG: Current realm loginTheme setting"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c '
              set +e
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user "\$KEYCLOAK_ADMIN" \
                --password "\$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1

              REALM=\$(/opt/keycloak/bin/kcadm.sh get realms --fields realm 2>/dev/null \
                | grep -o "\\"realm\\"[ ]*:[ ]*\\"[^\\"]*\\"" \
                | sed "s/.*: *\\"//;s/\\"//" \
                | grep -v "^master$" \
                | head -1)

              if [ -n "\$REALM" ]; then
                echo Realm=\$REALM
                /opt/keycloak/bin/kcadm.sh get realms/\$REALM --fields realm,loginTheme
              else
                echo No non-master realm found
              fi
            '"

            echo "===> DEBUG: Recent Keycloak theme/template logs in last 15 minutes"
            _in_vm "sudo kubectl logs -n $KC_NS $KC_POD --since=15m | grep -iE 'theme|freemarker|template|ftl|loginTheme|error' | tail -150 || true"

            echo "===> DEBUG: Last 120 Keycloak log lines"
            _in_vm "sudo kubectl logs -n $KC_NS $KC_POD --tail=120"

            echo "===> [8] Done. Do NOT restart Keycloak. Login theme name: $THEME"
            echo "Open Admin Console -> Realm settings -> Themes -> Login theme = $THEME"
