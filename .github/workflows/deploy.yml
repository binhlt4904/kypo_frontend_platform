name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp
            THEME=kypo-v3

            echo "=== Check source files ==="
            ls -la $SRC/login/
            ls -la $SRC/login/resources/css/

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            # Tạo thư mục trong pod
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/resources/css"

            # Copy từng file bằng kubectl cp (không cần stdin/pipe)
            _in_vm "sudo kubectl cp $SRC/login/theme.properties           $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/theme.properties"
            _in_vm "sudo kubectl cp $SRC/login/template.ftl               $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/template.ftl"
            _in_vm "sudo kubectl cp $SRC/login/login.ftl                  $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/login.ftl"
            _in_vm "sudo kubectl cp $SRC/login/error.ftl                  $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/error.ftl"
            _in_vm "sudo kubectl cp $SRC/login/info.ftl                   $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/info.ftl"
            _in_vm "sudo kubectl cp $SRC/login/login-reset-password.ftl   $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/login-reset-password.ftl"
            _in_vm "sudo kubectl cp $SRC/login/login-verify-email.ftl     $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/login-verify-email.ftl"
            _in_vm "sudo kubectl cp $SRC/login/login-page-expired.ftl     $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/login-page-expired.ftl"
            _in_vm "sudo kubectl cp $SRC/login/login-update-password.ftl  $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/login-update-password.ftl"
            _in_vm "sudo kubectl cp $SRC/login/resources/css/login.css    $KC_NS/$KC_POD:/opt/keycloak/themes/$THEME/login/resources/css/login.css"

            echo "=== Verify files in pod ==="
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- find /opt/keycloak/themes/$THEME -type f"

            # Clear cache
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c 'rm -rf /opt/keycloak/data/tmp/kc-gzip-cache 2>/dev/null || true'"

            # Set theme cho realm CRCZP
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \$KEYCLOAK_ADMIN \
                --password \$KEYCLOAK_ADMIN_PASSWORD && \
              /opt/keycloak/bin/kcadm.sh update realms/CRCZP \
                -s loginTheme=$THEME
            '"

            # Restart Keycloak để reload theme
            echo "=== Restarting Keycloak ==="
            _in_vm "sudo kubectl rollout restart statefulset/keycloak -n $KC_NS"
            _in_vm "sudo kubectl rollout status statefulset/keycloak -n $KC_NS --timeout=120s"

      - name: Check Keycloak logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }
            _in_vm "sudo kubectl logs keycloak-0 -n crczp --tail=20"
            _in_vm "sudo kubectl logs keycloak-0 -n crczp --tail=100 | grep -A5 'TemplateNotFound\|Caused by\|ERROR' || true"

      - name: Verify kypo-v3
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }
            echo "=== Files in kypo-v3 ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- find /opt/keycloak/themes/kypo-v3 -type f"
            echo "=== theme.properties ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- cat /opt/keycloak/themes/kypo-v3/login/theme.properties"
            echo "=== login.ftl (first 5 lines) ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- head -5 /opt/keycloak/themes/kypo-v3/login/login.ftl"