name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy frontend image to Kubernetes
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          echo "==> Deploying: $IMAGE"

          sudo kubectl set image deployment/angular-frontend \
            angular-frontend="$IMAGE" \
            -n crczp

          sudo kubectl rollout status deployment/angular-frontend \
            -n crczp --timeout=120s

          echo "==> Deploy thanh cong: $IMAGE"

      - uses: actions/checkout@v4

      - name: Deploy Keycloak theme
        env:
          KC_POD: keycloak-0
          KC_NS: crczp
          THEME: "vuontre-login-${{ github.run_number }}-${{ github.run_attempt }}"
          SRC: "${{ github.workspace }}/keycloak-theme"
        run: |
          set -e

          echo "===> [1] Kiem tra thu muc theme..."
          test -f "$SRC/login/theme.properties"
          test -f "$SRC/login/login.ftl"
          test -f "$SRC/login/resources/css/login.css"
          test -f "$SRC/login/resources/js/login.js"
          test -f "$SRC/login/messages/messages_en.properties"

          echo "===> [2] Tao thu muc theme trong Keycloak pod..."
          sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c "
            rm -rf /opt/keycloak/themes/$THEME &&
            mkdir -p /opt/keycloak/themes/$THEME/login/resources/css \
                     /opt/keycloak/themes/$THEME/login/resources/js \
                     /opt/keycloak/themes/$THEME/login/messages
          "

          echo "===> [3] Copy file theme vao pod..."
          _copy_file() {
            local src="$1" dst="$2"
            local encoded
            encoded=$(base64 -w0 "$src")
            sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c "
              printf '%s' '$encoded' | base64 -d > $dst && ls -lh $dst
            "
          }

          _copy_file "$SRC/login/theme.properties" "/opt/keycloak/themes/$THEME/login/theme.properties"
          _copy_file "$SRC/login/login.ftl" "/opt/keycloak/themes/$THEME/login/login.ftl"
          _copy_file "$SRC/login/resources/css/login.css" "/opt/keycloak/themes/$THEME/login/resources/css/login.css"
          _copy_file "$SRC/login/resources/js/login.js" "/opt/keycloak/themes/$THEME/login/resources/js/login.js"
          _copy_file "$SRC/login/messages/messages_en.properties" "/opt/keycloak/themes/$THEME/login/messages/messages_en.properties"

          echo "===> [4] Apply loginTheme=$THEME vao realm CRCZP..."
          sudo kubectl exec -n $KC_NS $KC_POD -- /bin/sh -c "
            /opt/keycloak/bin/kcadm.sh config credentials \
              --server http://localhost:8080/keycloak \
              --realm master \
              --user \"\$KEYCLOAK_ADMIN\" \
              --password \"\$KEYCLOAK_ADMIN_PASSWORD\" && \
            /opt/keycloak/bin/kcadm.sh update realms/CRCZP -s loginTheme=$THEME && \
            echo 'Theme applied:' && \
            /opt/keycloak/bin/kcadm.sh get realms/CRCZP --fields realm,loginTheme
          "

          echo "===> Done. Theme: $THEME"