name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp
            THEME=kypo-v2

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            _copy_file() {
              local src=$1
              local dst=$2
              cat $src | base64 | \
                _in_vm "base64 -d > /tmp/kc-upload && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > $dst' < /tmp/kc-upload"
            }

            # Tạo thư mục
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/resources/css"

            # Copy tất cả file
            _copy_file $SRC/login/theme.properties          /opt/keycloak/themes/$THEME/login/theme.properties
            _copy_file $SRC/login/template.ftl              /opt/keycloak/themes/$THEME/login/template.ftl
            _copy_file $SRC/login/login.ftl                 /opt/keycloak/themes/$THEME/login/login.ftl
            _copy_file $SRC/login/error.ftl                 /opt/keycloak/themes/$THEME/login/error.ftl
            _copy_file $SRC/login/info.ftl                  /opt/keycloak/themes/$THEME/login/info.ftl
            _copy_file $SRC/login/login-reset-password.ftl  /opt/keycloak/themes/$THEME/login/login-reset-password.ftl
            _copy_file $SRC/login/login-verify-email.ftl    /opt/keycloak/themes/$THEME/login/login-verify-email.ftl
            _copy_file $SRC/login/login-page-expired.ftl    /opt/keycloak/themes/$THEME/login/login-page-expired.ftl
            _copy_file $SRC/login/login-update-password.ftl /opt/keycloak/themes/$THEME/login/login-update-password.ftl
            _copy_file $SRC/login/resources/css/login.css   /opt/keycloak/themes/$THEME/login/resources/css/login.css

            # Clear cache
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c 'rm -rf /opt/keycloak/data/tmp/kc-gzip-cache 2>/dev/null || true'"

            # Set theme
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \$KEYCLOAK_ADMIN \
                --password \$KEYCLOAK_ADMIN_PASSWORD 2>/dev/null && \
              /opt/keycloak/bin/kcadm.sh update realms/CRCZP \
                -s loginTheme=$THEME 2>/dev/null || true
            '"

      - name: Check new Keycloak logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }
            _in_vm "sudo kubectl logs keycloak-0 -n crczp --tail=10"
            _in_vm "sudo kubectl logs keycloak-0 -n crczp --tail=50 | grep -A5 'TemplateNotFound\|Caused by\|ERROR'"

      - name: Verify theme files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- find /opt/keycloak/themes/kypo-anim -type f"

      - name: Verify kypo-v2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }
            echo "=== List all files in kypo-v2 ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- find /opt/keycloak/themes/kypo-v2 -type f"
            echo "=== Content of login.ftl ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- cat /opt/keycloak/themes/kypo-v2/login/login.ftl"
            echo "=== Content of theme.properties ==="
            _in_vm "sudo kubectl exec -n crczp keycloak-0 -- cat /opt/keycloak/themes/kypo-v2/login/theme.properties"