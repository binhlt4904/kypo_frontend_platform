name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp
            THEME=kypo-anim

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            # Tạo thư mục trong pod
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/resources/css"

            # Copy theme.properties
            cat $SRC/login/theme.properties | base64 | \
              _in_vm "base64 -d > /tmp/kc-theme.properties && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > /opt/keycloak/themes/$THEME/login/theme.properties' < /tmp/kc-theme.properties"

            # Copy login.css
            cat $SRC/login/resources/css/login.css | base64 | \
              _in_vm "base64 -d > /tmp/kc-login.css && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > /opt/keycloak/themes/$THEME/login/resources/css/login.css' < /tmp/kc-login.css"

            # Copy error.ftl
            cat $SRC/login/error.ftl | base64 | \
              _in_vm "base64 -d > /tmp/kc-error.ftl && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > /opt/keycloak/themes/$THEME/login/error.ftl' < /tmp/kc-error.ftl"

            # Set theme via kcadm
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \$KEYCLOAK_ADMIN \
                --password \$KEYCLOAK_ADMIN_PASSWORD 2>/dev/null && \
              /opt/keycloak/bin/kcadm.sh update realms/crczp \
                -s loginTheme=$THEME 2>/dev/null || true
            '"