name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend-platform:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/frontend-platform:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to K8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            /home/ubuntu/frontend-platform/build-deploy.sh "${{ needs.build.outputs.image }}"

      - name: Copy Keycloak theme to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "keycloak-theme/"
          target: "/tmp/kypo-theme-ci/"

      - name: Deploy Keycloak theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            SRC="/tmp/kypo-theme-ci/keycloak-theme"
            KC_POD=keycloak-0
            KC_NS=crczp
            THEME=kypo-v6

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            _copy_file() {
              local src=$1
              local dst=$2
              cat $src | base64 | \
                _in_vm "base64 -d > /tmp/kc-upload && sudo kubectl exec -i -n $KC_NS $KC_POD -- /bin/bash -c 'cat > $dst' < /tmp/kc-upload"
            }

            echo "===> [1] Tao thu muc theme kypo-v6 trong pod..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/resources/css"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- mkdir -p /opt/keycloak/themes/$THEME/login/messages"

            echo "===> [2] Copy 3 file theme (parent=keycloak tu lo ftl)..."
            _copy_file $SRC/login/theme.properties \
              /opt/keycloak/themes/$THEME/login/theme.properties
            _copy_file $SRC/login/resources/css/login.css \
              /opt/keycloak/themes/$THEME/login/resources/css/login.css
            _copy_file $SRC/login/messages/messages_en.properties \
              /opt/keycloak/themes/$THEME/login/messages/messages_en.properties

            echo "===> [3] Verify files trong pod..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- find /opt/keycloak/themes/$THEME -type f"
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- cat /opt/keycloak/themes/$THEME/login/theme.properties"

            echo "===> [4] Apply theme kypo-v6 vao realm..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- /bin/bash -c '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080/keycloak \
                --realm master \
                --user \$KEYCLOAK_ADMIN \
                --password \$KEYCLOAK_ADMIN_PASSWORD && \
              /opt/keycloak/bin/kcadm.sh update realms/crczp \
                -s loginTheme=$THEME
            '"

            echo "===> [5] Keycloak log - tim ERROR lien quan theme..."
            _in_vm "sudo kubectl logs $KC_POD -n $KC_NS --tail=50 2>&1 | grep -i 'error\|warn\|theme\|kypo\|exception' || echo 'Khong co error'"

            echo "===> [6] Keycloak log - 20 dong cuoi..."
            _in_vm "sudo kubectl logs $KC_POD -n $KC_NS --tail=20 2>&1"

            echo "===> Done! Vao Keycloak Admin chon loginTheme=kypo-v6 neu chua tu dong apply"

      - name: Check JAR structure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            KYPO_DIR=$(find /home -name "kypo-sp26" -type d 2>/dev/null | head -1)
            KC_POD=keycloak-0
            KC_NS=crczp
            JAR=/opt/keycloak/lib/lib/main/org.keycloak.keycloak-themes-25.0.1.jar

            _in_vm() {
              docker run --rm \
                -e LIBVIRT_DEFAULT_URI \
                -v /var/run/libvirt/:/var/run/libvirt/ \
                -v ~/.vagrant.d:/.vagrant.d \
                -v "$KYPO_DIR":"$KYPO_DIR" \
                -w "$KYPO_DIR" --network host \
                vagrantlibvirt/vagrant-libvirt:latest \
                vagrant ssh -- "$@"
            }

            echo "===> Check built-in theme directories..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- sh -c 'find /opt/keycloak/themes -maxdepth 3 -type f | grep \\.ftl | sort | head -200 || true'"

            echo "===> Verify JAR exists..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- ls -lh $JAR"

            echo "===> Copy JAR from Keycloak pod to VM by base64..."
            _in_vm "sudo kubectl exec -n $KC_NS $KC_POD -- sh -c 'base64 -w0 $JAR' > /tmp/keycloak-themes.jar.b64"
            _in_vm "base64 -d /tmp/keycloak-themes.jar.b64 > /tmp/keycloak-themes.jar"

            echo "===> List all FTL files inside JAR..."
            _in_vm "python3 - <<'PY'
            import zipfile

            jar = '/tmp/keycloak-themes.jar'

            with zipfile.ZipFile(jar, 'r') as z:
                ftl_files = [f for f in z.namelist() if f.endswith('.ftl')]
                print('Total FTL files:', len(ftl_files))
                for f in ftl_files:
                    print(f)
            PY"

            echo "===> Extract login FTL files to /tmp/keycloak-ftl..."
            _in_vm "rm -rf /tmp/keycloak-ftl && mkdir -p /tmp/keycloak-ftl && python3 - <<'PY'
            import zipfile

            jar = '/tmp/keycloak-themes.jar'
            out = '/tmp/keycloak-ftl'

            with zipfile.ZipFile(jar, 'r') as z:
                for f in z.namelist():
                    if f.endswith('.ftl') and '/login/' in f:
                        z.extract(f, out)
                        print('Extracted:', f)

            print('Done. Output:', out)
            PY"

            echo "===> Show extracted login FTL files..."
            _in_vm "find /tmp/keycloak-ftl -type f | sort | head -200"
