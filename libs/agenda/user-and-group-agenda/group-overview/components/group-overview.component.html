<div class="portal-content">
    <div class="portal-title">
        <span class="portal-title-icon">
            <span class="material-icons">group_work</span>
        </span>
        Groups
    </div>

    <div class="page-filter-card">
        <div class="filter-row">
                <input type="text" class="filter-input" placeholder="Search by group name...">
            <div class="filter-row-actions">
                <button class="filter-btn-search">
                    <span class="material-icons">search</span> Search
                </button>
                <button class="filter-btn-refresh" title="Refresh">
                    <span class="material-icons">refresh</span>
                </button>
            </div>
        </div>
    </div>

    <div class="dashboard-grid full-width">
        <div class="chart-panel">
            <div class="chart-panel-header">
                <span class="panel-header-title">Groups Overview</span>
            </div>
            <div class="chart-panel-body" style="padding: 0;">
                <sentinel-controls [controls]="controls">
                </sentinel-controls>
                <sentinel-table
                    (rowSelection)="onGroupSelected($event)"
                    (tableLoad)="onTableLoadEvent($event)"
                    [data]="groups$ | async"
                    [defaultSortDirection]="INIT_SORT_DIR"
                    [defaultSortName]="INIT_SORT_NAME"
                    [hasError]="groupsHasError$ | async">
                </sentinel-table>
            </div>
        </div>
    </div>
</div>
