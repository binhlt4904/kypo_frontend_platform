<div class="portal-content">
    <div class="portal-title">
        <span class="portal-title-icon">
            <span class="material-icons">view_list</span>
        </span>
        Sandbox Definitions
    </div>

    <div class="page-filter-card">
        <div class="filter-rows">
            <div class="filter-row">
                <select class="filter-select"><option>All States</option><option>Unreleased</option><option>Released</option></select>
                <input type="text" class="filter-input" placeholder="Search by name...">
            </div>
        </div>
        <div class="filter-footer">
            <button class="filter-btn-search">
                <span class="material-icons">search</span> Search
            </button>
            <button class="filter-btn-refresh" title="Refresh">
                <span class="material-icons">refresh</span>
            </button>
        </div>
    </div>

    <div class="dashboard-grid full-width">
        <div class="chart-panel">
            <div class="chart-panel-header">
                <span class="panel-header-title">Definitions Overview</span>
            </div>
            <div class="chart-panel-body">
                <sentinel-controls [controls]="controls" />
                <sentinel-table
                    (tableLoad)="onLoadEvent($event)"
                    [data]="sandboxDefinitions$ | async"
                    [defaultSortName]="'id'"
                    [hasError]="hasError$ | async">
                </sentinel-table>
            </div>
        </div>
    </div>
</div>
