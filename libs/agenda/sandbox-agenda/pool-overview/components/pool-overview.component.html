<div class="portal-content">
    <div class="portal-title">
        <span class="portal-title-icon">
            <span class="material-icons">dns</span>
        </span>
        Sandbox Pools
    </div>

    <div class="page-filter-card">
        <div class="filter-row">
            <input type="text" class="filter-input" placeholder="Search by title..."
                   [value]="filterText" (input)="filterText = $any($event.target).value"
                   (keyup.enter)="onSearchClicked()">
            <div class="filter-row-actions">
                <button class="filter-btn-search" (click)="onSearchClicked()">
                    <span class="material-icons">search</span> Search
                </button>
                <button class="filter-btn-refresh" title="Refresh" (click)="onRefreshClicked()">
                    <span class="material-icons">refresh</span>
                </button>
            </div>
        </div>
    </div>

    <sentinel-controls [controls]="controls" />

    <div class="dashboard-grid full-width">
        <div class="chart-panel">
            <div class="chart-panel-body" style="padding:0">
                <sentinel-table
                    (tableLoad)="onLoadEvent($event)"
                    [data]="pools$ | async"
                    [defaultSortDirection]="DEFAULT_SORT_DIRECTION"
                    [defaultSortName]="DEFAULT_SORT_COLUMN"
                    [displayedActionsCount]="8"
                    [hasError]="hasError$ | async"
                    [titlecasedActions]="false"
                    [titlecasedColumnHeaders]="false">
                    <ng-container *sentinelRow="'lockState'; template: lockState" />
                    <ng-container *sentinelRow="'comment'; template: comment" />
                </sentinel-table>

                <ng-template #lockState let-row>
                    <crczp-table-state-cell [iconColor]="" [icon]="getPoolStateIcon(row)" [text]="row.element.lockState" />
                </ng-template>

                <ng-template #comment let-row>
                    <crczp-editable-comment (commentChanged)="updatePoolComment(row.element,$event)" [value]="row.element.comment" />
                </ng-template>
            </div>
        </div>

        <div class="chart-panel">
            <div class="chart-panel-header">
                <span class="panel-header-title">Resource Quotas</span>
            </div>
            <div class="chart-panel-body">
                <crczp-quotas [resources]="resources$" />
                <br>
                <crczp-hardware-quota-summary [quota]="currentQuota" (configSaved)="loadQuota()" />
            </div>
        </div>
    </div>
</div>
