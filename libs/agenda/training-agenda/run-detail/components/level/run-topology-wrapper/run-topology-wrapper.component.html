@let topologyCollapsed = topologyService.topologyCollapsed$ | async;
@let sandboxInstanceId = (this.runService.runInfo$.observeProperty().sandboxInstanceId.$() | async);

@if (topologyAllowed() && !!sandboxInstanceId) {
<div class="topology-section">
    <div class="topo-zone-bar" (click)="topologyService.toggleCollapsed()">
        <mat-icon class="topo-icon">device_hub</mat-icon>
        <span class="topo-zone-bar__label">Network topology</span>
        <span class="topo-badge">live</span>
        <div class="topo-zone-bar__actions" (click)="$event.stopPropagation()">
            <button type="button" class="topo-action-btn" (click)="resetSplitRequested.emit()"
                aria-label="Reset topology size" title="Reset split (task | topology)">
                <mat-icon>view_agenda</mat-icon>
            </button>
            <button type="button" class="topo-action-btn" (click)="maximizeTopoRequested.emit()"
                aria-label="Maximize topology (hide task)" title="Maximize topology (hide task)">
                <mat-icon>open_in_full</mat-icon>
            </button>
            <button type="button" class="topo-action-btn" [class.topo-action-btn--active]="topoFullscreen()"
                (click)="fullscreenRequested.emit()" aria-label="Toggle fullscreen"
                [title]="topoFullscreen() ? 'Exit fullscreen' : 'Fullscreen topology'">
                <mat-icon>{{ topoFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
            </button>
        </div>
    </div>
    <div class="topo-content">
        <crczp-topology-wrapper (getAccessFile)="onAccessFileRequested()" [id]="{instanceId: sandboxInstanceId}"
            [standalone]="false" class="wh-100 topo-graph" />
    </div>
</div>
}
