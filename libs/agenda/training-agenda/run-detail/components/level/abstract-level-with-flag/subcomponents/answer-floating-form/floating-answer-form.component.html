<div class="flag-dock">
    <div class="flag-dock__bar">
        <mat-icon class="flag-dock__icon">flag</mat-icon>
        <span class="flag-dock__title">Submit flag</span>
        <button
            (click)="closed.emit()"
            aria-label="Close flag dock"
            class="flag-dock__close"
            mat-icon-button
        >
            <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
    </div>
    <div class="flag-dock__body">
        <div class="flag-dock__hints">
            <ng-content />
        </div>
        <div class="flag-dock__input-row">
            <mat-form-field
                (keydown.enter)="$event.preventDefault()"
                appearance="outline"
                class="input-form-field"
                subscriptSizing="dynamic">
                <input
                    (keydown)="keyboardSubmitAnswer($event)"
                    [(ngModel)]="answer"
                    [ngModelOptions]="{ standalone: true }"
                    autocomplete="off"
                    matInput
                    placeholder="FLAG{...}"
                />
                <button
                    (click)="answer.set('')"
                    [hidden]="!answer()"
                    aria-label="Clear"
                    mat-icon-button
                    matSuffix
                >
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
            <button
                (click)="submitAnswer()"
                [disabled]="isLoading()"
                class="submit-button"
                color="primary"
                mat-flat-button
            >
                {{ buttonLabel() }}
            </button>
        </div>
    </div>
</div>
