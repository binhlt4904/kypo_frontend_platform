<div class="portal-content">
    <div class="portal-title">
        <span class="portal-title-icon">
            <span class="material-icons">assignment</span>
        </span>
        Training Runs
    </div>

    <div class="page-filter-card">
        <div class="filter-row">
                <select class="filter-select"><option>All States</option><option>In Progress</option><option>Finished</option><option>Archived</option></select>
                <input type="text" class="filter-input" placeholder="Search by run name...">
            <div class="filter-row-actions">
                <button class="filter-btn-search">
                    <span class="material-icons">search</span> Search
                </button>
                <button class="filter-btn-refresh" title="Refresh">
                    <span class="material-icons">refresh</span>
                </button>
            </div>
        </div>
    </div>

    <crczp-access-training-run (accessToken)="access($event)" [isLoading]="isLoading" />

    <div class="dashboard-grid full-width">
        <div class="chart-panel">
            <div class="chart-panel-header">
                <span class="panel-header-title">Runs Overview</span>
            </div>
            <div class="chart-panel-body" style="padding: 0;">
                <sentinel-controls [controls]="controls"
                                   [titlecased]="false" />
                <sentinel-table
                    (tableLoad)="loadAccessedTrainingRuns($event)"
                    [data]="trainingRuns$ | async"
                    [hasError]="hasError$ | async"
                >
                </sentinel-table>
            </div>
        </div>
    </div>
</div>
