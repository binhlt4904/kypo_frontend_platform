<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const idToken = params.get('id_token');
            const expiresIn = parseInt(params.get('expires_in') || '300', 10);
            const sessionState = params.get('session_state') || '';
            const redirectTo = params.get('redirect_to') || '/run';


            if (!accessToken) {
                window.location.href = '/login';
                return;
            }

            // Parse id_token claims
            let idTokenClaims = {};
            let idTokenExpiresAt = (Math.round(Date.now() / 1000) + expiresIn) * 1000;
            let nonce = '';
            if (idToken) {
                try {
                    const payload = idToken.split('.')[1];
                    idTokenClaims = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
                    if (idTokenClaims.exp) idTokenExpiresAt = idTokenClaims.exp * 1000;
                    if (idTokenClaims.nonce) nonce = idTokenClaims.nonce;
                } catch (e) { }
            }

            const now = Date.now();
            const expiresAt = (Math.round(now / 1000) + expiresIn) * 1000;

            localStorage.clear();

            localStorage.setItem('access_token', accessToken);
            localStorage.setItem('refresh_token', refreshToken || '');
            localStorage.setItem('id_token', idToken || '');
            localStorage.setItem('session_state', sessionState);
            localStorage.setItem('access_token_stored_at', String(now));
            localStorage.setItem('expires_at', String(expiresAt));
            localStorage.setItem('id_token_stored_at', String(now));
            localStorage.setItem('id_token_expires_at', String(idTokenExpiresAt));
            localStorage.setItem('id_token_claims_obj', JSON.stringify(idTokenClaims));
            localStorage.setItem('granted_scopes', JSON.stringify(["profile", "offline_access", "openid", "email"]));
            localStorage.setItem('nonce', nonce);
            localStorage.setItem('sentinel_auth_provider_id', 'CRCZP-Client');


            setTimeout(function () {
                window.location.replace(redirectTo);
            }, 200);
        })();
    </script>
</body>

</html>
