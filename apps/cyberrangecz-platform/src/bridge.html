<!DOCTYPE html>
<html>
<head><title>KYPO Bridge</title></head>
<body>
<script>
  (function() {
    console.log('[Bridge] Starting...');
    
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const idToken      = params.get('id_token');
    const expiresIn    = parseInt(params.get('expires_in') || '300', 10);
    const sessionState = params.get('session_state') || '';

    console.log('[Bridge] access_token:', accessToken ? 'OK' : 'NULL');
    console.log('[Bridge] id_token:', idToken ? 'OK' : 'NULL');

    if (!accessToken) {
      console.log('[Bridge] No token, redirecting to login');
      window.location.href = '/login';
      return;
    }

    // Parse id_token claims
    let idTokenClaims = {};
    let idTokenExpiresAt = (Math.round(Date.now() / 1000) + expiresIn) * 1000;
    if (idToken) {
      try {
        const payload = idToken.split('.')[1];
        idTokenClaims = JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
        if (idTokenClaims.exp) {
          idTokenExpiresAt = idTokenClaims.exp * 1000;
        }
      } catch(e) {
        console.log('[Bridge] Error parsing id_token:', e);
      }
    }

    const now = Date.now();
    const expiresAt = (Math.round(now / 1000) + expiresIn) * 1000;

    // Clear old state first
    localStorage.removeItem('access_token');
    localStorage.removeItem('id_token');
    localStorage.removeItem('refresh_token');
    localStorage.removeItem('nonce');
    localStorage.removeItem('PKCE_verifier');

    // Set tokens theo đúng format angular-oauth2-oidc
    localStorage.setItem('access_token', accessToken);
    localStorage.setItem('refresh_token', refreshToken || '');
    localStorage.setItem('id_token', idToken || '');
    localStorage.setItem('session_state', sessionState);
    localStorage.setItem('access_token_stored_at', String(now));
    localStorage.setItem('expires_at', String(expiresAt));
    localStorage.setItem('id_token_stored_at', String(now));
    localStorage.setItem('id_token_expires_at', String(idTokenExpiresAt));
    localStorage.setItem('id_token_claims_obj', JSON.stringify(idTokenClaims));
    localStorage.setItem('granted_scopes', JSON.stringify(["profile","offline_access","openid","email"]));

    console.log('[Bridge] All tokens set');
    console.log('[Bridge] access_token in storage:', localStorage.getItem('access_token') ? 'YES' : 'NO');
    console.log('[Bridge] Redirecting to /run...');

    // Delay nhỏ để đảm bảo localStorage được write xong
    setTimeout(function() {
      window.location.replace('/run');
    }, 100);
  })();
</script>
</body>
</html>
